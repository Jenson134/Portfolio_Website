{% include 'header.html' %}
<main class="mb-4">
            <div class="container px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        <p class="p--email">Want to get in touch? Fill out the form below to send me a message and I will get back to you as soon as possible!</p>
                        <div class="my-5">
                            {% if error %}
                                <div class="alert alert-danger" role="alert">
                                    {{ error }}
                                </div>
                                {% elif success %}
                                <div class="alert alert-success" role="alert">
                                    {{ success }}
                                </div>
                            {% endif %}
                            <form id="contactForm" method="POST" action="{{ url_for('email') }}">
                                <!-- Email -->
                                <div class="form-floating">
                                    <input class="form-control" id="email" name="email" type="email"
                                        placeholder="Enter your email..." required />
                                    <label for="email">Email address</label>
                                </div>

                                <!-- Confirm Email -->
                                <div class="form-floating">
                                    <input class="form-control" id="confirm_email" name="confirm_email" type="email"
                                        placeholder="Confirm your email..." required />
                                    <label for="confirm_email">Confirm Email address</label>
                                </div>

                                <!-- Subject -->
                                <div class="form-floating">
                                    <input class="form-control" id="subject" name="subject" type="text"
                                        placeholder="Email Subject..." required />
                                    <label for="subject">Subject</label>
                                </div>

                                <!-- Message -->
                                <div class="form-floating">
                                    <textarea class="form-control" id="message" name="message"
                                            placeholder="Enter your message here..." style="height: 12rem" required></textarea>
                                    <label for="message">Message</label>
                                </div>

                                <br />
                                <button class="btn btn-primary text-uppercase" type="submit">
                                    Send
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
</main>
{% include 'footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/scripts.js"></script>
<script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
